[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evaldataset"
version = "0.1.0"
description = "HuggingFace CPT dataset quality checker and auto-fixer CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "datasets>=2.14",
    "rich>=13.0",
    "tqdm>=4.66",
    "datasketch>=1.6",
    "fast-langdetect>=1.0",
    "beautifulsoup4>=4.12",
    "ftfy>=6.1",
    "regex>=2023.0",
    "tiktoken>=0.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
]

[project.scripts]
evaldataset = "evaldataset.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evaldataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=evaldataset --cov-report=term-missing"

[tool.coverage.run]
source = ["src/evaldataset"]
